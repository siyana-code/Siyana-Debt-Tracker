name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi
          echo "Tag $TAG_VERSION matches package.json"

      - name: Tag is on main
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Release branch $BRANCH still exists. Merge it back into develop first."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## Siyana Debt Tracker $TAG_VERSION"
            echo ""
            echo "Tag \`$TAG_VERSION\` verified: typecheck clean, tests passing, version in sync."
            echo ""
            echo "Build with: \`eas build --platform all --profile production\`"
          } >> "$GITHUB_STEP_SUMMARY"