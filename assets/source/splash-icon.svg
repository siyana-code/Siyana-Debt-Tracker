<?xml version="1.0" encoding="UTF-8"?>
<!--
  Siyana Debt Tracker — splash screen.

  Beautiful White (#F7F7F7) field, the Bleu de France mark, the app name and the
  Siyana Code signature. Rendered at imageWidth 180 by the expo-splash-screen
  plugin, so keep the wordmark legible at small scale.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#F7F7F7"/>

  <g transform="translate(0 -10) scale(0.8)">
    <g transform="translate(512 512) scale(0.95) translate(-512 -512)">
      <circle cx="512" cy="512" r="268" fill="none" stroke="#3484F0" stroke-width="54"/>

      <g transform="translate(-94 94) rotate(45 512 512)">
        <path fill="#3484F0" d="M 502 590 L 502 478 L 468 478 L 512 434 L 556 478 L 522 478 L 522 590 Z"/>
      </g>
      <g transform="translate(94 -94) rotate(45 512 512)">
        <path fill="#3484F0" d="M 502 434 L 502 546 L 468 546 L 512 590 L 556 546 L 522 546 L 522 434 Z"/>
      </g>
    </g>
  </g>

  <text x="512" y="700" text-anchor="middle"
        font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="#3484F0">Siyana Debt Tracker</text>

  <text x="512" y="766" text-anchor="middle"
        font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="6" fill="#757575">SIYANA CODE</text>
</svg>