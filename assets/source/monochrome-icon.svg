    <g transform="translate(512 512) scale(0.78) translate(-512 -512)">
      <path fill="#000000" d="M 502 590 L 502 478 L 468 478 L 512 434 L 556 478 L 522 478 L 522 590 Z"/>
    </g>
  </g>

  <g transform="translate(94 -94) rotate(45 512 512)">
    <g transform="translate(512 512) scale(0.78) translate(-512 -512)">
      <path fill="#000000" d="M 502 434 L 502 546 L 468 546 L 512 590 L 556 546 L 522 546 L 522 434 Z"/>
    </g>
  </g>
</svg>