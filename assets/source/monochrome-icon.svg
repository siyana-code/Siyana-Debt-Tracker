<!--
  Siyana Debt Tracker — Android themed (monochrome) icon.

  A single-colour glyph on transparency. Android recolours it to match the
  user's wallpaper palette, so shape must carry the whole meaning: no gradients,
  no colour, no fine detail.
-->
