<?xml version="1.0" encoding="UTF-8"?>
<!--
  Siyana Debt Tracker — Android adaptive icon foreground.

  Transparent background. The launcher masks this to a circle or squircle, so
  the mark is kept inside the inner ~66% safe zone with generous clearance from
  every edge. Android tints this white over the background colour set in app.json.
-->
